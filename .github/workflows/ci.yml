name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The differential tests compare against HarfBuzz and poppler themselves.
      # Without these they skip, and the suite still passes — but then it is not
      # measuring the things this package exists to get right.
      - name: Install HarfBuzz and poppler
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-bin poppler-utils

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
